<html lang="ko">
<head>

<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3ede2;--card:#fbf8f1;--ink:#231f1a;--sub:#7b7263;--line:#d9cfbd;--accent:#3a6b5a;--accent-ink:#f3e9d2;--gold:#b08d4a;--chip:#ebe3d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2125;--ink:#ece4d3;--sub:#9a937f;--line:#33363a;--accent:#dcb96f;--accent-ink:#15171a;--gold:#c9a45c;--chip:#272a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2125;--ink:#ece4d3;--sub:#9a937f;--line:#33363a;--accent:#dcb96f;--accent-ink:#15171a;--gold:#c9a45c;--chip:#272a2e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:env(safe-area-inset-top,0px) 0 0 0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--dot,rgba(176,141,74,.55)) 1.6px,transparent 2px);background-size:18px 18px}
body{margin:0;background:transparent;color:var(--ink);font-family:Jua,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;font-synthesis:none;max-width:720px;margin-inline:auto;padding:18px 16px 100px}
input,select,textarea,button{font:inherit;color:inherit}
header{position:relative;text-align:center;margin:-18px -16px 14px;padding:28px 16px 14px;background:var(--bg);border-bottom:3px double var(--gold)}
.hang{width:150px;margin:0 auto}
.hang svg{display:block;width:100%;height:auto;color:var(--gold)}
h1{margin:2px 0 4px;padding-left:.18em;font-size:26px;letter-spacing:.18em;font-weight:700;white-space:nowrap}
.ver{font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:3px;vertical-align:middle;margin-left:6px}
.sub{color:var(--sub);font-size:13px;letter-spacing:.04em}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vr{font-size:12px;letter-spacing:.04em;color:var(--sub);white-space:nowrap}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);outline:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0 4px}
.chips.s{padding:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:3px;cursor:pointer;font-size:13px;transition:transform .12s}
.chip:active,.btn:active,.fab:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.s .chip{font-size:12px;border-style:dashed}
.chips.s .chip.on{border-style:solid}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;position:relative;box-shadow:0 1px 0 var(--gold);transition:transform .12s}
.item:active{transform:scale(.98)}
.ph{aspect-ratio:3/4;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:46px;position:relative}
.ph svg{position:absolute;width:70%;opacity:.22;color:var(--gold)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.meta{padding:9px 11px;border-top:1px solid var(--line)}
.n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:12px;color:var(--gold);margin-top:3px;font-weight:700}
.star{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--gold);border-radius:3px;padding:2px 7px;font-size:13px;z-index:1}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:2px 7px;font-size:12px;z-index:1}
.empty{text-align:center;color:var(--sub);padding:40px 12px;line-height:1.8}
.empty svg{width:270px;max-width:90%;color:var(--gold);margin-bottom:8px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:1px solid var(--gold);border-radius:4px;padding:14px 22px;font-weight:700;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;transition:transform .12s}
dialog{border:1px solid var(--gold);border-bottom:0;border-radius:8px 8px 0 0;background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:94vh;margin:auto auto 0;padding:0;overflow:auto}
dialog[open]{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(0,0,0,.55)}
.nav{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;background:var(--card);border-bottom:1px solid var(--line);touch-action:none}
.nav::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--gold);opacity:.6}
.tt{font-weight:700;font-size:16px;letter-spacing:.08em}
.tb{border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:4px}
.tb.b{font-weight:700}
.tb:disabled{opacity:.4}
.sheet{padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.pic{aspect-ratio:4/3;border:1px dashed var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;overflow:hidden;background:var(--bg);text-align:center;font-size:14px;line-height:1.7}
.pic img{width:100%;height:100%;object-fit:contain}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;letter-spacing:.05em}
.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:3px;padding:8px 12px;background:var(--bg)}
.fr span{font-size:14px}
.sw{position:relative;width:51px;height:31px;flex:none;margin:0}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:3px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;transition:transform .12s}
.btn.d{color:#b3402f}
.info{font-size:13px;color:var(--sub);min-height:18px;text-align:center}
h1{font-size:30px}
.sub{font-size:15px}
.vr{font-size:14px}
.search{font-size:17px}
.chip{font-size:15px}
.chips.s .chip{font-size:14px}
.n{font-size:16px}
.s{font-size:14px}
.pr{font-size:14px}
.star{font-size:15px}
.tag{font-size:14px}
.empty{font-size:16px}
.fab{font-size:17px}
.tt{font-size:18px}
.tb{font-size:18px}
.pic{font-size:16px}
label{font-size:14px}
.f{font-size:17px}
.fr span{font-size:16px}
.btn{font-size:17px}
.info{font-size:14px}
.sel{position:relative;cursor:pointer}
.sel select{pointer-events:none;font-family:inherit}
select,option{font-family:inherit}
#pk{max-height:70vh}
.pkh{padding:18px 16px 10px;text-align:center;color:var(--sub);font-size:15px;border-bottom:1px solid var(--line);letter-spacing:.06em}
.pko{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 20px;font-size:18px;cursor:pointer;text-align:left}
.pko:active{background:var(--chip)}
.pko.on{color:var(--accent)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login[hidden]{display:none}
.lbox{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:28px 24px;text-align:center;max-width:340px;width:100%}
.lt{font-size:28px;letter-spacing:.12em;margin-bottom:8px}
.ls{color:var(--sub);font-size:15px;margin:8px 0}
#gbtn{width:100%;margin-top:12px;padding:14px;border:1px solid var(--gold);border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:17px;cursor:pointer}
.lh{width:110px;color:var(--gold);display:block;margin:0 auto 6px}
#pw,#em{width:100%;margin-top:8px;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:18px;text-align:center;letter-spacing:.2em;outline:0}
#em{letter-spacing:0;font-size:17px}
.sp{display:block;margin-top:8px;font-size:14px;color:var(--sub);text-align:left;cursor:pointer}
.sp input{margin-right:6px}
#gbtn:disabled{opacity:.5}
.lo{position:absolute;top:10px;right:14px;border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rec{display:block;width:100%;margin:0 0 12px;padding:14px;border:1px solid var(--gold);border-radius:4px;background:var(--card);color:var(--accent);font-size:17px;cursor:pointer;transition:transform .12s}
.rec:active{transform:scale(.98)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--gold);overflow:hidden}
.oh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:16px}
.oc2{color:var(--gold);font-size:14px}
.og{display:grid;gap:2px;background:var(--line)}
.ot{position:relative;aspect-ratio:1/1;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.ot.wide{aspect-ratio:auto}
.ot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ol{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:12px;line-height:1.3;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcempty{text-align:center;color:var(--sub);padding:30px 12px;line-height:1.8;white-space:pre-line;font-size:16px}
.thp{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 10px;font-size:15px;color:var(--sub)}
.thp button{border:0;background:none;color:var(--sub);font-size:15px;padding:4px 9px;border-radius:3px;cursor:pointer}
.thp button.on{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

h1,.tt,.lt,.tmt,.ct{font-family:var(--hfont,Jua,"Noto Sans KR",sans-serif)}
.item,.tmc,.pic,.f,.search,.fr,.btn,.tmb,.lbox,#pw,#em,#gbtn,.fab{border-radius:var(--rad,4px)}
.chip{border-radius:calc(var(--rad,3px) + 1px)}
dialog{border-radius:var(--drad,8px) var(--drad,8px) 0 0}
.tm{margin:0 0 14px}
.tmh{margin:0 0 6px}
.tmt{font-size:22px;font-weight:700;letter-spacing:.04em}
.tmw{font-size:15px;color:var(--sub);line-height:1.5;margin-top:2px}
.tmr{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 12px;-webkit-overflow-scrolling:touch}
.tmc{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 0 var(--gold)}
.tmch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.ct{font-weight:700;font-size:18px;white-space:nowrap}
.cd{font-size:14px;color:var(--sub);padding:8px 12px 10px;line-height:1.4;border-top:1px solid var(--line)}
.tmhint{color:var(--sub);font-size:15px;padding:18px 6px;line-height:1.6}
.tmb{display:block;width:100%;padding:13px;border:1px solid var(--gold);background:var(--card);color:var(--accent);font-size:17px;cursor:pointer}
.lnk{border:0;background:none;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0 0 0 8px}
:root[data-th="tailor"] body::before{background-image:repeating-linear-gradient(90deg,var(--pat) 0 1px,transparent 1px 16px);background-size:auto}
:root[data-th="tailor"] header{border-bottom:0;padding-bottom:24px}
:root[data-th="tailor"] header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 1.5px,transparent 1.5px 10px) 0 0/100% 7px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2px no-repeat}
:root[data-th="tailor"] .item,:root[data-th="tailor"] .tmc{outline:1.5px dashed var(--gold);outline-offset:-6px;box-shadow:0 4px 12px rgba(60,20,30,.08)}
:root[data-th="tailor"] dialog{outline:1.5px dashed var(--gold);outline-offset:-7px}
.chip{border-style:dashed}
.chip.on{border-style:solid;outline:1px dashed var(--accent-ink);outline-offset:-4px}
.fab,.tmb{outline:1.5px dashed var(--gold);outline-offset:-5px}
.fab{outline-color:rgba(246,230,208,.65)}
.tmch{border-bottom:1.5px dashed var(--gold)}
.cd{border-top:1.5px dashed var(--gold)}
.meta{border-top:1.5px dashed var(--line)}
.nav{border-bottom:1.5px dashed var(--gold)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="hg" viewBox="0 0 64 64"><path d="M32 14a5 5 0 1 1 5 5c-3 1-5 2-5 5v3M32 27L6 44a3 3 0 0 0 2 5h48a3 3 0 0 0 2-5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hg2" viewBox="0 0 240 82"><path d="M120 40V30C120 24 130 22 130 14A10 10 0 0 0 110 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M120 40L16 70Q10 72 12 77H228Q230 72 224 70Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></symbol>
</defs></svg>
<header>
  <button class="lo" id="lo">로그아웃</button>
  <div class="hang"><svg viewBox="0 0 240 82" aria-hidden="true"><path d="M120 40V30C120 24 130 22 130 14A10 10 0 0 0 110 14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 40L16 70Q10 72 12 77H228Q230 72 224 70Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
  <h1>내 옷장</h1></div>
  <div class="orn" id="orn"></div>
  <div class="stat"><div class="sub" id="count">불러오는 중…</div><span class="vr">version 6.1</span></div>
</header>
<section class="tm" id="tm" hidden>
  <div class="tmh"><div class="tmt" id="tmt">🥂 내일의 코디</div><div class="tmw" id="tmw"></div></div>
  <div class="tmr" id="tmr"></div>
  <button class="tmb" id="tmb">다시 추천</button>
</section>
<input class="search" id="q" placeholder="이름, 브랜드, 색상 검색" type="search">
<div class="chips" id="chips"></div>
<div class="chips s" id="subchips" hidden></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>
  <svg viewBox="0 0 300 46" aria-hidden="true"><path d="M6 10H294" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/><use href="#hg2" x="16" y="5" width="84" height="29"/><use href="#hg2" x="108" y="5" width="84" height="29"/><use href="#hg2" x="200" y="5" width="84" height="29"/></svg><br>
  옷장이 비어 있어요.<br>아래 버튼으로 첫 옷을 등록해 보세요. <span id="eem">👔</span>
</div>
<button class="fab" id="add">+ 등록</button>

<dialog id="dlg">
  <div class="nav"><button class="tb" id="cancel">취소</button><div class="tt" id="ttl">새 옷</div><button class="tb b" id="save">저장</button></div>
  <div class="sheet">
    <div class="pic" id="pic">🖼️ 갤러리에서 사진 선택</div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    <div><label>이름</label><input class="f" id="name" placeholder="예: 네이비 울 블레이저"></div>
    <div class="row">
      <div><label>종류</label><div class="sel"><select class="f" id="cat" tabindex="-1"></select></div></div>
      <div><label>세부 종류</label><div class="sel"><select class="f" id="sub" tabindex="-1"></select></div></div>
    </div>
    <div class="row">
      <div><label>계절</label><div class="sel"><select class="f" id="season" tabindex="-1"></select></div></div>
      <div><label>가격 (원)</label><input class="f" id="price" type="number" inputmode="numeric" min="0" placeholder="0"></div>
    </div>
    <div class="row">
      <div><label>색상</label><input class="f" id="color" placeholder="네이비"></div>
      <div><label>사이즈</label><input class="f" id="size" placeholder="M"></div>
    </div>
    <div><label>브랜드</label><input class="f" id="brand"></div>
    <div><label>메모</label><textarea class="f" id="memo" rows="2"></textarea></div>
    <div class="fr"><span>★ 즐겨찾기</span><label class="sw"><input type="checkbox" id="favsw"><i></i></label></div>
    <div class="btns" id="acts"><button class="btn" id="wear">👕 오늘 입었어요</button><button class="btn d" id="del">삭제</button></div>
    <div class="info" id="info"></div>

      c.toBlob(function(b){b?res(b):rej(new Error("fail"))},"image/jpeg",0.82);
    };
    im.onerror=function(){rej(new Error("load"))};im.src=u;
  });
}

  if(/정장|슈트|수트|양복|블레이저|자켓|재킷/.test(n))v+=.25;
  if(/후드|트레이닝|츄리닝|맨투맨|티셔츠/.test(n))v-=.2;
  if(/청|데님|진/.test(n))v-=.1;
  return Math.max(0,Math.min(1,v));
}
function tomorrow(){return new Date(Date.now()+864e5)}
function seasonFor(){
  if(rec.wx){return rec.wx.tmax>=26?"여름":rec.wx.tmax<=12?"겨울":"봄·가을"}
  var m=tomorrow().getMonth()+1;
  return (m===12||m<=2)?"겨울":(m>=6&&m<=8)?"여름":"봄·가을";
}
function needOuter(se){
  if(rec.wx)return rec.wx.tmax<=19||rec.wx.tmin<=12;
  return se==="겨울"||(se==="봄·가을"&&Math.random()<.6);
}
function okSeason(it,se){return !it.season||it.season==="사계절"||it.season===se}
function pool(cn,se){
  var all=items.filter(function(i){return i.category===cn});
  var f=all.filter(function(i){return okSeason(i,se)});
  return f.length?f:all;
}
function sc(it,c,extra){
  var today=new Date().toISOString().slice(0,10);
  var v=Math.random()*1.2-(it.worn||0)*0.04-(it.lastWorn===today?2:0)+(it.fav?0.3:0)-(rec.use[it.id]||0)*0.5;
  if(c&&c.t!==undefined)v-=Math.abs(fm(it)-c.t)*3;
  if(c&&c.neu&&!isNeutral(it.color))v-=3;
  if(rec.wx){
    var avg=(rec.wx.tmax+rec.wx.tmin)/2;
    if(avg<=10&&COLD_BAD.indexOf(it.sub)>=0)v-=3;
    if(rec.wx.tmax>=26&&HOT_BAD.indexOf(it.sub)>=0)v-=3;
  }
  return v+(extra?extra(it):0);
}
function pick(list,c,taken,extra){
  var cand=list.filter(function(i){return !taken[i.id]});
  if(!cand.length)return null;
  var b=null,bs=-1e9;
  cand.forEach(function(i){var v=sc(i,c,extra);if(v>bs){bs=v;b=i}});
  return b;
}
function genOutfit(c){
  var se=seasonFor(),o=[],taken={};
  if(c.sport){
    var sp=pool("운동복",se);if(!sp.length)return null;
    var gr={};sp.forEach(function(i){var k=i.sub||"기타";(gr[k]=gr[k]||[]).push(i)});
    var ks=Object.keys(gr),k0=ks[Math.floor(Math.random()*ks.length)],pl=gr[k0].length>=2?gr[k0]:sp;
    for(var n=0;n<3;n++){var p=pick(pl,null,taken);if(!p)break;taken[p.id]=1;o.push(p)}
    var shs=pool("신발",se),s3=shs.length?pick(shs,{t:.25},taken):null;
    if(s3){taken[s3.id]=1;o.push(s3)}
    var acs=pool("액세서리",se),a3=acs.length?pick(acs,{t:.2},taken):null;
    if(a3){taken[a3.id]=1;o.push(a3)}
    return {c:c,ids:o.map(function(i){return i.id}),t:null,b:null};
  }
  var tops=pool("상의",se),bots=pool("하의",se);
  if(!tops.length||!bots.length)return null;
  var t=pick(tops,c,taken,function(i){return (c.top&&c.top.indexOf(i.sub)>=0?2.5:0)-(i.sub==="조끼"?2.5:0)});taken[t.id]=1;
  var b=pick(bots,c,taken,function(i){var f=colorFit(t,i);if(c.pop&&(isNeutral(t.color)!==isNeutral(i.color)))f+=.5;return f});
  taken[b.id]=1;o.push(t,b);
  if(needOuter(se)){
    var ow=pool("아우터",se),a=ow.length?pick(ow,c,taken,function(i){return colorFit(t,i)*.5}):null;
    if(a){taken[a.id]=1;o.unshift(a)}
  }
  var shp=pool("신발",se),s2=shp.length?pick(shp,c,taken):null;
  if(s2){taken[s2.id]=1;o.push(s2)}
  var bgp=pool("가방",se),g2=bgp.length?pick(bgp,c,taken):null;
  if(g2){taken[g2.id]=1;o.push(g2)}
  var acp=pool("액세서리",se).filter(function(i){return c.t>=.75?!/볼캡|비니|버킷햇|선글라스/.test(i.sub||""):true});
  var usedSub={};
  for(var q=0;q<(c.t>=.75?3:2);q++){
    var x=pick(acp.filter(function(i){return !usedSub[i.sub||i.id]}),c,taken);
    if(x){taken[x.id]=1;usedSub[x.sub||x.id]=1;o.push(x)}
  }
  return {c:c,ids:o.map(function(i){return i.id}),t:t,b:b};
}
function genBatch(n){
  var added=0,guard=0;
  while(added<n&&rec.list.length<MAXREC&&guard<60){
    guard++;
    var c=CONCEPTS[rec.next%CONCEPTS.length];rec.next++;
    var got=null;
    for(var tr=0;tr<8&&!got;tr++){
      var cand=genOutfit(c);if(!cand)break;
      cand.key=cand.ids.slice().sort().join("|");
      cand.pair=cand.t&&cand.b?cand.t.id+"|"+cand.b.id:"";
      var dupKey=rec.list.some(function(r){return r.key===cand.key});
      var dupPair=cand.pair&&rec.list.some(function(r){return r.pair===cand.pair});
      if(!dupKey&&(!dupPair||tr>=5))got=cand;
    }
    if(got){got.ids.forEach(function(id){rec.use[id]=(rec.use[id]||0)+1});rec.list.push(got);added++}
  }
}
function geo(){return new Promise(function(res,rej){if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000,maximumAge:3600000})})}
async function loadWx(){
  rec.wxStarted=true;
  var lat=37.5665,lon=126.978,place="서울 기준",saved=null;
  try{saved=JSON.parse(localStorage.getItem("closet-loc")||"null")}catch(e){}
  if(saved&&saved.ok){lat=saved.lat;lon=saved.lon;place="내 위치"}
  else if(!saved){
    try{
      var p=await geo();lat=p.coords.latitude;lon=p.coords.longitude;place="내 위치";
      try{localStorage.setItem("closet-loc",JSON.stringify({ok:true,lat:lat,lon:lon}))}catch(e){}
    }catch(e){try{localStorage.setItem("closet-loc",JSON.stringify({ok:false}))}catch(x){}}
  }
  try{
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},8000);
    var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat.toFixed(3)+"&longitude="+lon.toFixed(3)+"&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2",{signal:ctl.signal});
    clearTimeout(tm);
    var j=await r.json(),d=j.daily;
    rec.wx={tmax:d.temperature_2m_max[1],tmin:d.temperature_2m_min[1],rain:d.precipitation_probability_max[1],place:place};
  }catch(e){rec.wx=null}
  rec.wxDone=true;renderTm(true);
}
function hh(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function feel(t){return t<=5?"아주 추워요":t<=12?"추워요":t<=19?"쌀쌀해요":t<=25?"선선해요":"더워요"}
function renderTm(force){
  var sec=$("tm");
  if(!db){sec.hidden=true;return}
  sec.hidden=false;
  var byId={};items.forEach(function(i){byId[i.id]=i});
  var hasTB=items.some(function(i){return i.category==="상의"})&&items.some(function(i){return i.category==="하의"});
  if(hasTB&&rec.wxDone&&!rec.list.length)genBatch(BATCH);
  var sig=[th,rec.wxDone,hasTB,rec.list.map(function(o){return o.key+o.ids.map(function(id){var i=byId[id];return i?(i.name||"")+(i.img||"").length:"x"}).join(",")}).join(";")].join("#");
  if(!force&&sig===rec.sig)return;
  rec.sig=sig;
  $("tmt").textContent=kit().tm+" 내일의 코디";
  var d=tomorrow(),lab=(d.getMonth()+1)+"월 "+d.getDate()+"일("+"일월화수목금토".charAt(d.getDay())+")";
  var w=$("tmw");w.textContent="";
  var line;
  if(rec.wx){
    var avg=(rec.wx.tmax+rec.wx.tmin)/2;
    line="내일 "+lab+" · "+rec.wx.place+" 최저 "+Math.round(rec.wx.tmin)+"° / 최고 "+Math.round(rec.wx.tmax)+"° · "+feel(avg)+(rec.wx.rain>=50?" · 비 올 확률 "+rec.wx.rain+"% ☂️":"");
  }else line=rec.wxDone?"내일 "+lab+" · 날씨를 불러오지 못해 계절 기준으로 골랐어요":"내일 "+lab+" · 날씨를 확인하는 중…";
  w.appendChild(document.createTextNode(line));
  if(rec.wxDone){
    var lb=hh("button","lnk","📍 위치 갱신");
    lb.onclick=function(){try{localStorage.removeItem("closet-loc")}catch(e){}rec.wxDone=false;rec.wx=null;rec.list=[];rec.use={};rec.next=0;renderTm(true);loadWx()};
    w.appendChild(lb);
  }
  var row=$("tmr");row.textContent="";
  if(!hasTB){row.appendChild(hh("div","tmhint","상의와 하의를 1벌 이상 등록하면 내일 날씨에 맞는 코디를 바로 보여 드려요."));$("tmb").hidden=true;return}
  if(!rec.wxDone){row.appendChild(hh("div","tmhint","코디를 고르는 중…"));$("tmb").hidden=true;return}
  rec.list.forEach(function(o){
    var its=o.ids.map(function(id){return byId[id]}).filter(Boolean);
    if(its.length<2)return;
    var card=hh("div","tmc"),hd=hh("div","tmch");
    hd.appendChild(hh("span","ct",o.c.e+" "+o.c.n));
    hd.appendChild(hh("span","oc2",its.map(function(i){return i.color}).filter(Boolean).slice(0,2).join(" + ")));
    card.appendChild(hd);
    var n=its.length,cols=n<=2?2:n===3?3:n===4?2:3,g=hh("div","og");
    g.style.gridTemplateColumns="repeat("+cols+",1fr)";
    its.forEach(function(it,i){
      var t=hh("div","ot");
      if(it.img){var im=document.createElement("img");im.src=it.img;im.alt="";t.appendChild(im)}else t.appendChild(document.createTextNode(emo(it)));
      t.appendChild(hh("div","ol",it.name||it.category));
      if(i===n-1&&n%cols){t.style.gridColumn="span "+(cols-(n%cols)+1);t.className="ot wide"}
      g.appendChild(t);
    });
    card.appendChild(g);card.appendChild(hh("div","cd",o.c.d));row.appendChild(card);
  });
  var b=$("tmb");b.hidden=false;
  b.textContent=rec.list.length>=MAXREC?"처음부터 다시 추천":"다시 추천 ("+rec.list.length+"/"+MAXREC+")";
  if(rec.focus!==null){var el=row.children[rec.focus];if(el)row.scrollTo({left:el.offsetLeft-6,behavior:"smooth"});rec.focus=null}
}
$("tmb").onclick=function(){
  if(rec.list.length>=MAXREC){rec.list=[];rec.use={};rec.next=0;genBatch(BATCH);rec.focus=0}
  else{var st=rec.list.length;genBatch(BATCH);rec.focus=st}

};

var THEMES={
  tailor:{
    k:{orn:"✂ ┈┈┈ 🧵 ┈┈┈ ✂",empty:"🧵",sn:"✂️",si:"📏",pk:"✂",tm:"🧵"},
    x:{rad:"14px",drad:"22px",hfont:'"Gowun Batang",serif'},
    l:{bg:"#f7f0ea",card:"#fffaf5",ink:"#2a1a1c",sub:"#8a7478",line:"#e3d3c8",accent:"#6d1f30","accent-ink":"#f6e6d0",gold:"#a47a4e",chip:"#efe2d8",pat:"rgba(109,31,48,.10)"},
    d:{bg:"#1a1013",card:"#25171b",ink:"#f1e4dc",sub:"#aa8f95",line:"#3d2a30",accent:"#d9a98a","accent-ink":"#1a1013",gold:"#d9a98a",chip:"#2f1f25",pat:"rgba(217,169,138,.10)"}}
};
var th="tailor";
var TOKENS=["bg","card","ink","sub","line","accent","accent-ink","gold","chip","pat","rad","drad","hfont"];
function kit(){return THEMES[th].k}
function applyTheme(){
  var r=document.documentElement,t=THEMES[th];
  r.setAttribute("data-th",th);
  TOKENS.forEach(function(k){r.style.removeProperty("--"+k)});
  var dark=!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),set=dark?t.d:t.l;

  if(!firebaseConfig.apiKey||firebaseConfig.apiKey.indexOf("여기에")===0){
    $("count").textContent="index.html 위쪽의 firebaseConfig를 먼저 입력해 주세요.";return;
  }
  var app=initializeApp(firebaseConfig),fdb=getFirestore(app),auth=getAuth(app),colRef=collection(fdb,"closet"),unsub=null;
  col={doc:function(id){var r=doc(fdb,"closet",id);return{

      $("pw").value="";
    }).then(function(){$("gbtn").disabled=false});
  }

  $("lo").onclick=function(){signOut(auth)};
  try{$("em").value=localStorage.getItem("closet-email")||""}catch(x){}
  $("sp").onchange=function(){$("pw").type=this.checked?"text":"password"};
  onAuthStateChanged(auth,function(u){

      render();

  });
