<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// Firebase 웹 앱 설정값 (공개되어도 되는 값이에요. 보안은 Firestore 규칙이 담당해요)
var firebaseConfig={
  apiKey:"AIzaSyB9HL6nS3b8IJqlZYiTSN7LOk9lw9dovD4",
  authDomain:"closet-59ef6.firebaseapp.com",
  projectId:"closet-59ef6",
  storageBucket:"closet-59ef6.firebasestorage.app",

  appId:"1:382741184526:web:4858ab20ba6dbd7ed17c5f"
};

var CATS=[
 {n:"상의",e:"👔",s:["티셔츠","반팔티","긴팔티","셔츠","카라티","니트","스웨터","후드","맨투맨","조끼","기타"]},
 {n:"하의",e:"👖",s:["청바지","슬랙스","정장바지","면바지","카고팬츠","조거팬츠","반바지","기타"]},
 {n:"아우터",e:"🧥",s:["코트","트렌치코트","재킷","블레이저","양복","패딩","점퍼","바람막이","야상","가디건","플리스","기타"]},
 {n:"운동복",e:"🏃",s:["러닝","테니스","헬스·요가","등산","골프","수영","구기·팀웨어","기타"]},
 {n:"신발",e:"👟",s:["스니커즈","운동화","구두","로퍼","부츠","샌들","슬리퍼","기타"]},
 {n:"가방",e:"👜",s:["백팩","크로스백","숄더백","토트백","서류가방","클러치","파우치","에코백","기타"]},
 {n:"액세서리",e:"⌚",s:["시계","반지","볼캡","비니","버킷햇","안경","선글라스","벨트","넥타이","스카프","머플러","장갑","양말","지갑","기타"]}
];
var SUBMAP={"니트·스웨터":"니트","맨투맨·후드":"맨투맨","셔츠·블라우스":"셔츠","재킷·블레이저":"재킷","토트·숄더":"토트백","클러치·파우치":"클러치","샌들·슬리퍼":"샌들","안경·선글라스":"안경","스카프·머플러":"스카프","모자":"볼캡"};
var SUBE={"시계":"⌚","반지":"💍","볼캡":"🧢","비니":"🧶","버킷햇":"👒","안경":"👓","선글라스":"🕶️","벨트":"🪢","넥타이":"👔","스카프":"🧣","머플러":"🧣","장갑":"🧤","양말":"🧦","지갑":"💳","러닝":"🏃","테니스":"🎾","헬스·요가":"🧘","등산":"🥾","골프":"⛳","수영":"🏊","구기·팀웨어":"⚽","티셔츠":"👕","반팔티":"👕","긴팔티":"👕","셔츠":"👔","카라티":"👕","니트":"🧶","스웨터":"🧶","후드":"🧥","맨투맨":"👕","조끼":"🦺","청바지":"👖","슬랙스":"👖","정장바지":"👖","면바지":"👖","카고팬츠":"👖","조거팬츠":"👖","반바지":"🩳","코트":"🧥","트렌치코트":"🧥","재킷":"🧥","블레이저":"🧥","양복":"🤵","패딩":"🧥","점퍼":"🧥","바람막이":"🧥","야상":"🧥","가디건":"🧶","플리스":"🧥","스니커즈":"👟","운동화":"👟","구두":"👞","로퍼":"👞","부츠":"🥾","샌들":"🩴","슬리퍼":"🩴","백팩":"🎒","크로스백":"👜","숄더백":"👜","토트백":"👜","서류가방":"💼","클러치":"👝","파우치":"👝","에코백":"👜"};
var SEASONS=["사계절","봄·가을","여름","겨울"];
var $=function(i){return document.getElementById(i)};
var db=null,assets=null,col=null,items=[],outfits=[],logs=[],filter="전체",subf="",cur=null,imgData=null;
function cat(n){return CATS.filter(function(c){return c.n===n})[0]}
function emo(it){return SUBE[it.sub]||(cat(it.category)||{e:"👕"}).e}
function won(v){return "₩"+Number(v).toLocaleString("ko-KR")}
function fill(sel,arr){sel.textContent="";arr.forEach(function(v){var o=document.createElement("option");o.value=o.textContent=v;sel.appendChild(o)})}
fill($("cat"),CATS.map(function(c){return c.n}));fill($("season"),SEASONS);
function syncSub(val){
  var c=cat($("cat").value),sb=$("sub");sb.textContent="";
  var o=document.createElement("option");o.value="";o.textContent="선택 안 함";sb.appendChild(o);
  if(c)c.s.forEach(function(v){var p=document.createElement("option");p.value=p.textContent=v;sb.appendChild(p)});
  sb.value=val||"";
}
$("cat").onchange=function(){syncSub()};
function openPick(sel){
  var w=sel.parentNode,lab=w.previousElementSibling;
  $("pkt").textContent=kit().pk+" "+(lab?lab.textContent:"선택")+" "+kit().pk;
  var L=$("pkl");L.textContent="";
  Array.prototype.forEach.call(sel.options,function(o){
    var b=document.createElement("button");b.className="pko"+(o.value===sel.value?" on":"");
    var t=document.createElement("span");t.textContent=o.textContent;b.appendChild(t);
    if(o.value===sel.value){var c=document.createElement("span");c.textContent="✓";b.appendChild(c)}
    b.onclick=function(){sel.value=o.value;sel.dispatchEvent(new Event("change"));$("pk").close()};
    L.appendChild(b);
  });
  $("pk").showModal();
}
document.querySelectorAll(".sel").forEach(function(w){w.onclick=function(){openPick(w.querySelector("select"))}});
$("pk").addEventListener("click",function(e){if(e.target===$("pk"))$("pk").close()});

function mkChip(label,on,fn,host){
  var b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=label;b.onclick=fn;host.appendChild(b);
}
function renderChips(){
  var c=$("chips");c.textContent="";
  mkChip("전체",filter==="전체",function(){filter="전체";subf="";render()},c);
  mkChip("★ 즐겨찾기",filter==="즐겨찾기",function(){filter="즐겨찾기";subf="";render()},c);
  CATS.forEach(function(k){mkChip(k.e+" "+k.n,filter===k.n,function(){filter=k.n;subf="";render()},c)});
  var sc=$("subchips"),k=cat(filter);sc.textContent="";
  if(k){
    sc.hidden=false;
    mkChip("전체",!subf,function(){subf="";render()},sc);
    k.s.forEach(function(s){mkChip((SUBE[s]||"")+" "+s,subf===s,function(){subf=s;render()},sc)});
  }else sc.hidden=true;
}
function render(){
  renderChips();
  renderTm();
  var q=$("q").value.trim().toLowerCase();
  var list=items.filter(function(it){
    if(filter==="즐겨찾기"&&!it.fav)return false;
    if(filter!=="전체"&&filter!=="즐겨찾기"&&it.category!==filter)return false;
    if(subf&&it.sub!==subf)return false;
    if(q&&[it.name,it.brand,it.color,it.memo,it.sub].join(" ").toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return (b.created||0)-(a.created||0)});
  var g=$("grid");g.textContent="";
  list.forEach(function(it){
    var d=document.createElement("div");d.className="item";
    var ph=document.createElement("div");ph.className="ph";
    if(it.img){var im=document.createElement("img");im.src=it.img;im.loading="lazy";im.alt="";ph.appendChild(im)}
    else{ph.insertAdjacentHTML("afterbegin",'<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#hg"/></svg>');var em=document.createElement("span");em.textContent=emo(it);em.style.position="relative";ph.appendChild(em)}
    d.appendChild(ph);
    var tg=document.createElement("div");tg.className="tag";tg.textContent=emo(it);d.appendChild(tg);
    if(it.fav){var s=document.createElement("div");s.className="star";s.textContent="★";d.appendChild(s)}
    var m=document.createElement("div");m.className="meta";
    var n=document.createElement("div");n.className="n";n.textContent=it.name||"이름 없음";
    var sb=document.createElement("div");sb.className="s";
    sb.textContent=[it.sub||it.category,it.color].filter(Boolean).join(" · ")+(it.worn?" · "+it.worn+"회 착용":"");
    m.appendChild(n);m.appendChild(sb);
    if(it.price){var p=document.createElement("div");p.className="pr";p.textContent=won(it.price);m.appendChild(p)}
    d.appendChild(m);d.onclick=function(){openDlg(it)};g.appendChild(d);
  });
  $("empty").hidden=!(db&&items.length===0);
  if(db){
    var tot=items.reduce(function(a,it){return a+(Number(it.price)||0)},0);
    $("count").textContent="총 "+items.length+"벌"+(tot?" · 구매액 "+won(tot):"")+(list.length!==items.length?" · "+list.length+"벌 표시":"");
  }
}
$("q").oninput=render;

function openDlg(it){
  cur=it||null;imgData=null;imgUrl=null;pf.raw=null;pf.mask=null;
  $("ttl").textContent=(it?kit().si:kit().sn)+" "+(it?"옷 정보":"새 옷");
  $("name").value=it?it.name||"":"";$("cat").value=it&&cat(it.category)?it.category:(!it&&cat(filter)?filter:CATS[0].n);
  syncSub(it?it.sub:subf);
  $("season").value=it?it.season:SEASONS[0];$("price").value=it&&it.price?it.price:"";
  $("color").value=it?it.color||"":"";$("size").value=it?it.size||"":"";
  $("brand").value=it?it.brand||"":"";$("memo").value=it?it.memo||"":"";
  $("favsw").checked=!!(it&&it.fav);
  setPic(it&&it.img||null);
  $("bgauto").checked=pf.auto;$("bgedit").disabled=!(it&&it.img);
  $("acts").hidden=!it;
  var inf="";
  if(it&&it.lastWorn)inf="마지막 착용 "+it.lastWorn;

/* ===== 배경 제거 (기기 안에서 처리, 인터넷 불필요) ===== */
function cdist(d,i,r,g,b){var dr=d[i]-r,dg=d[i+1]-g,db=d[i+2]-b;return Math.sqrt(dr*dr+dg*dg+db*db)/4.4167}
function d2(p,c){return (p[0]-c[0])*(p[0]-c[0])+(p[1]-c[1])*(p[1]-c[1])+(p[2]-c[2])*(p[2]-c[2])}

function borderRefs(d,w,h){
  var s=[],st=Math.max(1,Math.floor(Math.max(w,h)/160));

  for(var x=0;x<w;x+=st){add(x,0);if(h>1)add(x,h-1)}
  for(var y=0;y<h;y+=st){add(0,y);if(w>1)add(w-1,y)}
  s.sort(function(a,b){return (a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])});
  var k=3,cs=[];
  for(var j=0;j<k;j++)cs.push(s[Math.floor((j+.5)*s.length/k)].slice());
  for(var it=0;it<6;it++){
    var sum=cs.map(function(){return [0,0,0,0]});
    s.forEach(function(p){var q=sum[nearest(cs,p)];q[0]+=p[0];q[1]+=p[1];q[2]+=p[2];q[3]++});
    cs=cs.map(function(c,ci){var q=sum[ci];return q[3]?[q[0]/q[3],q[1]/q[3],q[2]/q[3]]:c});
  }
  var cnt=cs.map(function(){return 0});
  s.forEach(function(p){cnt[nearest(cs,p)]++});
  var keep=cs.filter(function(c,ci){return cnt[ci]>=s.length*.05});
  return keep.length?keep:[cs[0]];
}
function neigh(i,w,h){

function autoMask(d,w,h,tol){

    $("login").hidden=true;$("pw").value="";db=true;if(!rec.wxStarted)loadWx();
    unsub=onSnapshot(colRef,function(snap){
      var all=snap.docs.map(function(d){var v=d.data()||{};v.id=d.id;if(v.sub==="일반"||v.sub==="해당 없음")v.sub="";if(SUBMAP[v.sub])v.sub=SUBMAP[v.sub];return v});
      items=all.filter(function(v){return !v.kind});
      outfits=all.filter(function(v){return v.kind==="outfit"}).sort(function(a,b){return (b.created||0)-(a.created||0)});
      logs=all.filter(function(v){return v.kind==="log"});
      if($("oc").open)renderOC();
      if($("cl").open)renderCal();
      render();
    },function(){$("count").textContent="데이터를 불러오지 못했어요. 규칙과 로그인 이메일이 같은지 확인해 주세요."});
  });
}
init();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
